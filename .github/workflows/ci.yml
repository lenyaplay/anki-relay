name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The same entry point developers run locally: ruff, the whole pytest suite
      # (including the real anki.syncserver integration test), repository hygiene,
      # docker compose config for both modes, docker build and container smoke tests.
      - name: Validate
        run: python scripts/validate.py
