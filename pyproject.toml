[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anki-relay"
version = "0.1.0"
description = "Self-hosted MCP server that lets Claude work with Anki collections synced through AnkiWeb"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Anki Relay contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # The anki engine is pinned exactly: the sync protocol and schema rules are
    # verified against this version (see docs/requirements/REQ-001-mvp.md).
    "anki==26.9.3",
    # mcp 2.x renamed FastMCP and changed the API.
    "mcp>=1.10,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
anki-relay = "anki_relay.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_relay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "RUF001", # Cyrillic text in translations is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S110", "S311", "S603", "S607", "B017"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:anki_relay.*"]
markers = [
    "syncserver: integration tests against a real local anki.syncserver (no external network)",
]
